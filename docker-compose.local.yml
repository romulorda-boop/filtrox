services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: filtrox
      POSTGRES_USER: filtrox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD apenas no ambiente local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - filtrox_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filtrox -d filtrox"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - filtrox_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_API_KEY:?Defina MEILI_API_KEY apenas no ambiente local}
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - filtrox_meili_data:/meili_data
volumes:
  filtrox_pgdata:
  filtrox_redisdata:
  filtrox_meili_data:
