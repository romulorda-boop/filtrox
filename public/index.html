<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f0" />
    <meta name="description" content="FILTROX — busca limpa e descoberta de vídeos." />
    <link rel="icon" href="/assets/filtrox-mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/home.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js" defer></script>
    <script src="/data-config.js" defer></script>
    <script src="/home.js" defer></script>
    <title>FILTROX</title>
  </head>
  <body>
    <div class="home-shell">
      <aside class="sidebar" aria-label="Filtros">
        <nav class="filter-list" aria-label="Ordenar vídeos">
          <button class="filter-button is-active" type="button" data-filter="recent" aria-pressed="true">Mais recente</button>
          <button class="filter-button" type="button" data-filter="watched" aria-pressed="false">Mais assistido</button>
          <button class="filter-button" type="button" data-filter="commented" aria-pressed="false">Mais comentado</button>
          <button class="filter-button" type="button" data-filter="rated" aria-pressed="false">Melhor avaliado</button>
        </nav>
      </aside>

      <main class="main-content">
        <form class="search-form" id="homeSearch" role="search">
          <label class="sr-only" for="homeSearchInput">Buscar</label>
          <input id="homeSearchInput" name="q" type="search" placeholder="Buscar" autocomplete="off" />
          <button class="search-submit" type="submit" aria-label="Buscar">↵</button>
        </form>
        <section class="search-results" aria-label="Resultados" aria-live="polite">
          <div class="result-grid" id="homeResultGrid"></div>
          <p class="no-results" id="homeNoResults" hidden>Nenhum resultado encontrado</p>
        </section>
      </main>
    </div>
  </body>
</html>
